name: Deploy invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # 카카오톡 미리보기(og:image)는 절대 주소가 필요해서 배포 주소를 자동으로 넣어줍니다.
      - name: Inject base URL
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          sed -i "s|__BASE_URL__|${BASE}|g" site/index.html site/ja/index.html

      # 이미지가 너무 크면 모바일에서 느려지므로 2MB 넘는 파일을 경고합니다.
      - name: Check image sizes
        run: |
          find site/images -type f -size +2M -print | while read f; do
            echo "::warning file=$f::2MB가 넘는 이미지입니다. 압축을 권장해요."
          done
          find site/audio -type f -size +4M -print 2>/dev/null | while read f; do
            echo "::warning file=$f::4MB가 넘는 음악 파일입니다. 비트레이트를 낮추길 권장해요."
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

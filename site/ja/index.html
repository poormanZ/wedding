<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 상위 폴더의 style.css, app.js, images/ 를 그대로 쓰기 위한 기준 경로 -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ユ・サンウォン と 谷口 ゆり、結婚します</title>
<meta name="description" content="2027年2月6日（土）午前11時30分、NAVER 1784 グリーンウェディングホール">
<meta property="og:type" content="website">
<meta property="og:title" content="ユ・サンウォン と 谷口 ゆり、結婚します">
<meta property="og:description" content="2027年2月6日（土）午前11時30分、NAVER 1784 グリーンウェディングホール">
<meta property="og:image" content="__BASE_URL__/images/og.png">
<meta property="og:url" content="__BASE_URL__/ja/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@300;400&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<!-- 디자인을 고치면 ?v= 숫자를 올려야 폰 캐시가 새 CSS 를 받음 -->
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<main>
  <a class="lang" href="./" lang="ko" hreflang="ko">한국어</a>
  <button type="button" id="bgmBtn" class="bgm" hidden aria-pressed="false" aria-label="BGMをオン"><span>♪</span></button>
  <header class="hero">
    <div class="hero-art">
      <p class="eyebrow">WEDDING INVITATION</p>
      <h1 class="hero-names"><span id="gName"></span><span class="and">と</span><span id="bName"></span></h1>
    </div>
    <p class="hero-date" aria-hidden="true"><span id="heroMonth"></span><span class="dot"></span><span id="heroDay"></span></p>
    <p class="hero-when" id="heroWhen"></p>
    <p class="hero-where" id="heroWhere"></p>
  </header>

  <section class="greeting">
    <h2><small>INVITATION</small>ご招待</h2>
    <p id="greetingText"></p>
    <ul class="family" id="family"></ul>
  </section>

  <section class="calendar">
    <h2><small>CALENDAR</small><span id="calTitle"></span></h2>
    <div class="cal-grid" id="calGrid" role="grid"></div>
    <p class="dday" id="dday"></p>
  </section>

  <section class="location">
    <h2><small>LOCATION</small>アクセス</h2>
    <p class="venue-name" id="venueName"></p>
    <p class="venue-addr" id="venueAddr"></p>
    <div class="map-actions">
      <a id="googleLink" target="_blank" rel="noopener">Googleマップ</a>
      <a id="naverLink" target="_blank" rel="noopener">NAVERマップ</a>
      <a id="kakaoLink" target="_blank" rel="noopener">カカオマップ</a>
      <button type="button" id="copyAddr">住所をコピー</button>
    </div>
    <dl class="transit" id="transit"></dl>
  </section>

  <footer>
    <button type="button" id="share" class="share">招待状をシェア</button>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="bgm" loop preload="auto"></audio>

<script src="config.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유상원 그리고 타니구치 유리, 결혼합니다</title>

<!-- 카카오톡·문자 미리보기. __BASE_URL__ 은 배포 시 자동으로 바뀝니다 -->
<meta property="og:type" content="website">
<meta property="og:title" content="유상원 그리고 타니구치 유리, 결혼합니다">
<meta property="og:description" content="2027년 2월 6일 토요일 오전 11시 30분, 네이버 1784 그린웨딩홀">
<meta property="og:image" content="__BASE_URL__/images/og.png">
<meta property="og:url" content="__BASE_URL__/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<!-- 디자인을 고치면 ?v= 숫자를 올려야 폰 캐시가 새 CSS 를 받음 -->
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<main>
  <a class="lang" href="ja/" lang="ja" hreflang="ja">日本語</a>
  <button type="button" id="bgmBtn" class="bgm" hidden aria-pressed="false" aria-label="배경음악 켜기"><span>♪</span></button>
  <header class="hero">
    <div class="hero-art">
      <p class="eyebrow">WEDDING INVITATION</p>
      <h1 class="hero-names"><span id="gName"></span><span class="and">그리고</span><span id="bName"></span></h1>
    </div>
    <p class="hero-date" aria-hidden="true"><span id="heroMonth"></span><span class="dot"></span><span id="heroDay"></span></p>
    <p class="hero-when" id="heroWhen"></p>
    <p class="hero-where" id="heroWhere"></p>
  </header>

  <section class="greeting">
    <h2><small>INVITATION</small>초대합니다</h2>
    <p id="greetingText"></p>
    <ul class="family" id="family"></ul>
  </section>

  <section class="calendar">
    <h2><small>CALENDAR</small><span id="calTitle"></span></h2>
    <div class="cal-grid" id="calGrid" role="grid"></div>
    <p class="dday" id="dday"></p>
  </section>

  <section class="location">
    <h2><small>LOCATION</small>오시는 길</h2>
    <p class="venue-name" id="venueName"></p>
    <p class="venue-addr" id="venueAddr"></p>
    <div class="map-actions">
      <a id="naverLink" target="_blank" rel="noopener">네이버 지도</a>
      <a id="kakaoLink" target="_blank" rel="noopener">카카오맵</a>
      <button type="button" id="copyAddr">주소 복사</button>
    </div>
    <dl class="transit" id="transit"></dl>
  </section>

  <section class="gift">
    <h2><small>WITH HEART</small>마음 전하실 곳</h2>
    <p class="gift-note">축하의 마음을 전하실 분들을 위해<br>계좌번호를 적어 두었습니다.<br>너그러운 마음으로 양해 부탁드립니다.</p>
    <div id="accounts"></div>
  </section>

  <footer>
    <button type="button" id="share" class="share">청첩장 공유하기</button>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="bgm" loop preload="auto"></audio>

<script src="config.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
